[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # The PayPal client id is public by design (it ships in the browser bundle to
  # load the PayPal button). Tell Netlify's secrets scanner not to flag it — the
  # real secrets (client secret, DB token, admin token) stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "PAYPAL_CLIENT_ID,PUBLIC_PAYPAL_CLIENT_ID"
